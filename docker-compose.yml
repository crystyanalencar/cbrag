services:
  qdrant:
    # Qdrant em modo servidor: permite que chat e ingest acessem a mesma
    # coleção concorrentemente (o modo embedded exige lock exclusivo de
    # arquivo) e suporta o volume atual da coleção, acima do limite
    # recomendado para o modo embedded (ver qdrant_store.py).
    # Versão fixa: atualizar o Qdrant migra o formato do storage sem
    # caminho de volta, então a troca de versão deve ser deliberada.
    image: qdrant/qdrant:v1.19.1
    volumes:
      - ./data/qdrant_server:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      # A imagem não traz curl nem wget: a requisição ao /readyz sai pelo
      # /dev/tcp do bash. Saudável só quando o Qdrant responde 200, não
      # apenas quando o processo sobe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  chat:
    build: .
    ports:
      - "127.0.0.1:8000:8000"  # bind em loopback; exposição externa via reverse proxy
    env_file:
      - .env
    environment:
      # Desativa tracing e telemetria remotos do CrewAI: conversas não saem
      # do host. Eventos são registrados localmente em
      # data/logs/eventos.jsonl (local_tracing.py).
      CREWAI_TRACING_ENABLED: "false"
      CREWAI_DISABLE_TELEMETRY: "true"
      # Cache persistente do modelo BM25 do fastembed, baixado do Hugging
      # Face no primeiro uso; evita novo download a cada container recriado.
      FASTEMBED_CACHE_PATH: /app/data/fastembed_cache
      # Prefixo de rota do Chainlit (vazio = raiz). Para servir sob sub-path,
      # definir no .env (ex.: "/chat"). O Chainlit registra as rotas já com
      # o prefixo, então o reverse proxy deve repassar o path completo, sem
      # removê-lo.
      CHAINLIT_ROOT_PATH: ${CHAINLIT_ROOT_PATH:-}
      # Endpoint do Qdrant na rede do compose. Sem esta variável,
      # qdrant_store.cliente() usa o modo embedded (arquivo local).
      QDRANT_URL: http://qdrant:6333
    volumes:
      # data/ é excluído da imagem (.dockerignore); todo dado lido em
      # runtime é montado a partir do diretório do projeto.
      - ./data/knowledge_storage:/app/data/knowledge_storage   # manifesto e dados legados do modo embedded; não lido em modo servidor
      - ./data/cvm_estruturado:/app/data/cvm_estruturado:ro    # DRE e composição do conselho (versionado)
      - ./data/knowledge:/app/data/knowledge:ro                # textos extraídos e _metadata.json, gerados por `uv run ingest`
      - ./data/fastembed_cache:/app/data/fastembed_cache
      - ./data/logs:/app/data/logs
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  ingest:
    # Job de execução sob demanda, fora do `docker compose up`:
    #   docker compose --profile ingest run --rm ingest uv run ingest
    # Usa a mesma imagem do chat, com os diretórios de coleta montados em
    # modo leitura e escrita, sem porta exposta nem política de restart.
    build: .
    profiles: ["ingest"]
    env_file:
      - .env
    environment:
      CREWAI_TRACING_ENABLED: "false"
      CREWAI_DISABLE_TELEMETRY: "true"
      FASTEMBED_CACHE_PATH: /app/data/fastembed_cache
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data/corpus:/app/data/corpus
      - ./data/pdfs:/app/data/pdfs
      - ./data/cvm:/app/data/cvm
      - ./data/ri_central:/app/data/ri_central   # Central de Downloads de RI: PDFs e _ri_index.json
      - ./data/corpus_pdf:/app/data/corpus_pdf
      - ./data/cvm_estruturado:/app/data/cvm_estruturado
      - ./data/knowledge:/app/data/knowledge
      - ./data/knowledge_storage:/app/data/knowledge_storage
      - ./data/cdx:/app/data/cdx
      - ./data/fastembed_cache:/app/data/fastembed_cache
      - ./data/logs:/app/data/logs
      - ./tests:/app/tests:ro   # golden_retrieval.json, usado por scripts/avaliar_retrieval.py
    depends_on:
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        # Limite para que a extração de PDFs grandes não esgote a memória do
        # host e derrube chat e qdrant, que rodam em paralelo.
        limits:
          cpus: "1.5"
          memory: 3G
