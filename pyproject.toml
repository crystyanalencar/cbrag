[project]
name = "casas_bahia_rag"
version = "0.1.0"
description = "casas_bahia_rag using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crewai[google-genai,litellm,tools]>=1.15.20,<2.0.0",
    "ollama>=0.6.2",
    "pypdf>=6.17.0",
    "qdrant-client[fastembed]>=1.19.0",
    "requests>=2.34.2",
]

[project.scripts]
kickoff = "casas_bahia_rag.main:kickoff"
chat = "casas_bahia_rag.main:chat"
ingest = "casas_bahia_rag.ingest_flow:kickoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "875dcb4a-f139-420d-95f9-eeb3f2d15097"
